<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read My Nails</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#F27BA5"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@500;700;900&family=Fredoka:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#FBF7FA;--card:#FFFFFF;--ink:#2B2140;--ink-2:#6A5E80;--ink-3:#9C93AC;--lilac:#9C7FD6;--pink:#F27BA5;--mint:#5FCDB4;--sun:#FFC85C;--sky:#7CC4F5;--nail:#FFF4F8;--nail-edge:#F2C9DA;--line:#EDE4F1;--good:#2E7D5B;--warn:#B7841A;--crit:#B8402F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1626;--card:#251E33;--ink:#F3EDF8;--ink-2:#C5B9D8;--ink-3:#8B7FA0;--lilac:#B9A2F0;--pink:#FF95B9;--mint:#6EDCC4;--sun:#FFD070;--sky:#8ED0FF;--nail:#2F2640;--nail-edge:#5A4A70;--line:#3A3050;--good:#5BBE92;--warn:#D9A23F;--crit:#E0705F}}
:root[data-theme="dark"]{--bg:#1B1626;--card:#251E33;--ink:#F3EDF8;--ink-2:#C5B9D8;--ink-3:#8B7FA0;--lilac:#B9A2F0;--pink:#FF95B9;--mint:#6EDCC4;--sun:#FFD070;--sky:#8ED0FF;--nail:#2F2640;--nail-edge:#5A4A70;--line:#3A3050;--good:#5BBE92;--warn:#D9A23F;--crit:#E0705F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font-family:inherit;font-weight:900;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:.95rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.btn{background:var(--lilac);color:#fff}.btn.pink{background:var(--pink)}.btn.ghost{background:var(--card);color:var(--ink-2);border:2px solid var(--line)}.btn.sm{padding:6px 12px;font-size:.82rem}.btn.mint{background:var(--mint);color:#1B3A33}.btn.crit{background:var(--crit);color:#fff}
input,select,textarea{font-family:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
label{display:block;font-size:.78rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:"Caveat",cursive;font-size:1.5rem;font-weight:700;color:var(--pink);line-height:1;text-decoration:none}
.brand small{display:block;font-family:"Nunito";font-size:.58rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--lilac);margin-top:2px}
.tabs{display:flex;gap:6px}
.tabs button{background:var(--card);color:var(--ink-2);border:2px solid var(--line);padding:6px 12px;font-size:.8rem}
.tabs button[aria-pressed="true"]{background:var(--lilac);color:#fff;border-color:var(--lilac)}
main{max-width:720px;margin:0 auto;padding:14px 14px 100px}
h1{font-weight:900;font-size:1.9rem;line-height:1.05;letter-spacing:-.02em;margin:10px 0 6px;text-wrap:balance}
h1 span{color:var(--lilac)}
h2{font-weight:900;font-size:1.15rem;margin:22px 0 8px}
h3{font-weight:900;font-size:1rem;margin:14px 0 6px}
p{margin:0 0 10px;max-width:62ch}
.muted{color:var(--ink-3);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.chap{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left}
.chap b{display:block;font-size:.98rem}.chap span{font-size:.78rem;color:var(--ink-3);font-weight:700}
.chap:hover{border-color:var(--lilac)}
.set{background:var(--card);border-radius:18px;padding:12px 14px 10px;margin-bottom:10px;border:2px solid var(--line);cursor:pointer;position:relative}
.set:hover{border-color:var(--lilac)}
.set .id{position:absolute;top:8px;right:12px;font-size:.62rem;font-weight:900;letter-spacing:.08em;color:var(--ink-3)}
.hand{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin-top:8px}
.nail{width:17.5%;aspect-ratio:1/1.55;background:var(--nail);border:2px solid var(--nail-edge);border-radius:48% 48% 40% 40% / 55% 55% 30% 30%;display:flex;align-items:center;justify-content:center;font-family:"Fredoka","Nunito",sans-serif;font-weight:700;font-size:clamp(1.1rem,5.6vw,1.9rem);line-height:1;text-align:center;overflow:hidden;position:relative;color:#111}
.nail .e{font-size:clamp(1.3rem,6.4vw,2.2rem)}.nail .s{font-size:clamp(.68rem,3vw,1rem)}.nail .xs{font-size:clamp(.55rem,2.4vw,.82rem)}
.nail img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.nail.sel{outline:3px solid var(--pink);outline-offset:2px}
.ans{margin-top:8px;font-size:.92rem;font-weight:900}.ans small{font-weight:600;color:var(--ink-2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.split .who{font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--pink);text-align:center}.split .hand{margin-top:2px}.split .nail{width:19%}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:900;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08)}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;max-height:220px;overflow:auto;padding:4px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.tile{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Fredoka";font-weight:700;font-size:1.1rem;cursor:pointer;padding:0;color:var(--ink)}
.tile.e{font-size:1.5rem}
.tile:hover{border-color:var(--lilac)}
.price{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:1.2rem;margin:10px 0}
.price small{font-size:.8rem;color:var(--ink-3);font-weight:700}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:30}
.code{font-family:ui-monospace,Menlo,monospace;font-size:2.6rem;font-weight:700;letter-spacing:.18em;text-align:center;color:var(--pink);margin:8px 0}
.qr{display:flex;justify-content:center;margin:10px 0}
.qr img,.qr canvas{border:8px solid #fff;border-radius:12px}
.order{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .oc{font-family:ui-monospace,monospace;font-weight:700;font-size:1.2rem;letter-spacing:.12em}
.pill{display:inline-block;font-size:.7rem;font-weight:900;letter-spacing:.06em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.p-new{background:#F8F0DE;color:#7A5A10}.p-prog{background:#E3EEF9;color:#1F4E79}.p-done{background:#E6F2EC;color:#2E7D5B}.p-x{background:#F7E6E3;color:#B8402F}
.recipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.recipe div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.72rem;line-height:1.25}
.recipe b{display:block;font-family:ui-monospace,monospace;font-size:.7rem;word-break:break-all}
.recipe .big{font-family:"Fredoka";font-size:1.3rem;display:block;margin-bottom:2px}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:120px}.stat b{display:block;font-size:1.4rem;font-weight:900}.stat span{font-size:.75rem;color:var(--ink-3);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.note{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;color:var(--ink-2)}
.hidden{display:none!important}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:900;z-index:50;font-size:.9rem}
.status{font-size:.72rem;color:var(--ink-3);font-weight:700}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:4px}
.status.on i{background:var(--good)}
.looks{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.look{border:2px solid #eee;border-radius:12px;padding:4px;background:transparent;display:grid;gap:2px;justify-items:center;font:inherit;font-size:.75rem;cursor:pointer}.look img{width:48px;height:72px;object-fit:cover;border-radius:8px;background:#fff}.look.on{border-color:#F27BA5}
.coachU{font-weight:700;margin:6px 0}.coachA{background:#FDEEF4;border-radius:12px;padding:8px 12px;margin:6px 0}
</style>
</head>

<script>
// ---------- data ----------
const LIB = JSON.parse(document.getElementById('LIB').textContent);

const HOST=()=>S.settings.host||'Host';
const DEFAULTS = {

const COLORMAP={pink:'Hot Pink',lilac:'Lilac',mint:'Mint',sun:'Sunshine',sky:'Sky',ink:'Black','':'Bare'};
let S = {mode:'customer', lang:'en', view:'chapters', chapter:null, set:null, build:null, editing:null, orders:[], bookings:[], settings:JSON.parse(JSON.stringify(DEFAULTS)), authed:false, db:null, dl:null, live:false, nview:'queue', filter:'active'};
const $=id=>document.getElementById(id); const app=$('app');
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function isEmoji(s){return !/[A-Za-z0-9¿¡?!&=.'\/#>+%~→ÁÉÍÓÚÑáéíóúñ]/.test(s)}
function slug(t){ if(t==='📷') return 'P-PHOTO'; if(isEmoji(t)) return 'E-'+Array.from(t).map(c=>c.codePointAt(0).toString(16)).join('_'); const mixed=/[a-z]/.test(t)&&t!==t.toLowerCase(); const src=mixed?t:t.toUpperCase(); const s=src.replace(/[^A-Za-z0-9ÁÉÍÓÚÑ]/g,m=>{const c=m.charCodeAt(0); if((c>=0xd800&&c<=0xdfff)||c===0xfe0f||c===0x20e3) return '_'; return {'?':'Q','!':'X','&':'AND','=':'EQ','.':'DOT',"'":'','/':'SL','#':'NUM','>':'GT','+':'PLUS','%':'PCT','~':'TLD','→':'ARR','¿':'IQ','¡':'IX',' ':'_'}[m]??('_u'+c.toString(16));}); const type=mixed?'M':/^[0-9]+$/.test(t)?'N':t.length===1?'L':'W'; return type+'-'+s; }
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function polishByName(n){return S.settings.polishes.find(p=>p.n===n)||S.settings.polishes[0]}
function inkByName(n){return S.settings.inks.find(p=>p.n===n)||S.settings.inks[0]}
function textColorFor(hex){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>150?'#111':'#fff'}
function chapters(){const cl=S.settings.claimed; return (LIB[S.lang.toUpperCase()]||[]).filter(c=>!S.settings.chaptersOff.includes(c.code)&&(c.custom||!Array.isArray(cl)||cl.includes(c.code)))}
function mergeChapters(list){ if(!Array.isArray(list)) return; for(const L of Object.keys(LIB)) LIB[L]=(LIB[L]||[]).filter(c=>!c.custom); for(const c of list){ const L=(c.lang||'EN').toUpperCase(); if(!LIB[L]) LIB[L]=[]; LIB[L].push({id:c.code.toLowerCase(),t:c.t,s:c.s||'',code:c.code,sets:c.sets,custom:true}); } }
async function enhancePhoto(x, dataUrl){ try{ const r=await fetch('/api/photo',{method:'POST',headers:H(),body:JSON.stringify({image:dataUrl})}); const j=await r.json(); if(j.looks){ x.looks=j.looks; if(!x.look){ x.look='photo'; x.photo=j.looks.photo.preview; x.photoFull=j.looks.photo.full; } render(); } }catch(e){} }
async function sayItForMe(){ const loves=($('loves')?.value||'').trim(); if(!loves){ $('loves').focus(); return; } const btn=$('sayBtn'); btn.disabled=true; btn.textContent='…'; try{ const r=await fetch('/api/ai/suggest',{method:'POST',headers:H(),body:JSON.stringify({loves:loves.split(/[,;]/),lang:S.lang})}); const j=await r.json(); S.suggest={sets:(j.sets||[]).concat((j.fresh||[])),note:j.note||(j.sets?.length||j.fresh?.length?'':(S.lang==='es'?'Nada aún — prueba con otras palabras.':'Nothing yet — try other words.'))}; }catch(e){ S.suggest={sets:[],note:'…'}; } render(); }

// ---------- nail rendering ----------
function nailFromSpec(n){const p=n.split('|');return {t:p[0],polish:COLORMAP[p[1]||''],ink:'Black',photo:null}}
function nailHTML(x,i,sel){ const pol=polishByName(x.polish); const bg=pol.h; let inner; const ink=x.ink==='Black'&&pol.n==='Black'?'#fff':(x.ink==='White'&&(pol.n==='Bare'||pol.n==='White')?'#111':inkByName(x.ink).h);
  if(x.photo) inner='<img src="'+x.photo+'" alt="">'; else if(isEmoji(x.t)) inner='<span class="e">'+esc(x.t)+'</span>'; else if(x.t.length>=5) inner='<span class="xs">'+esc(x.t)+'</span>'; else if(x.t.length>=3) inner='<span class="s">'+esc(x.t)+'</span>'; else inner='<span>'+esc(x.t)+'</span>';
  return '<div class="nail'+(sel===i?' sel':'')+'" data-i="'+i+'" style="background:'+bg+';border-color:'+(pol.n==='Bare'?'var(--nail-edge)':bg)+';color:'+ink+'">'+inner+'</div>'; }
function handHTML(arr,sel){return '<div class="hand">'+arr.map((x,i)=>nailHTML(x,i,sel)).join('')+'</div>'}
function setPreview(s){ if(s.n) return handHTML(s.n.map(nailFromSpec)); return '<div class="split"><div><div class="who">'+esc(s.w[0])+'</div>'+handHTML(s.sp[0].map(nailFromSpec))+'</div><div><div class="who">'+esc(s.w[1])+'</div>'+handHTML(s.sp[1].map(nailFromSpec))+'</div></div>'; }

const T={en:{h1:'Can you <span>read</span> my nails?',lede:'Pick a set. Tap any nail to make it yours. Show {HOST} your code — you print it, they teach you.',mine:'Make your own',search:'Search sets…',back:'← Back',hand:'One hand',both:'Both hands',order:'Get my code',name:'Your first name',tapnail:'Tap a nail to change it',letters:'Type letters, a number, or an emoji',photo:'Use my photo',polish:'Polish under this nail',inkc:'Print color',done:'Done',codeH:'Your code',codeP:'Show this to {HOST}. They\'ll teach you to print it — you do every step yourself.',again:'Make another',split:'Duo — two people',custom:'custom',lang:'Español'},
 es:{h1:'¿Puedes <span>leer</span> mis uñas?',lede:'Escoge un set. Toca cualquier uña para hacerla tuya. Muéstrale tu código a {HOST} — tú lo imprimes, te enseñan.',mine:'Hazlo tú misma',search:'Buscar sets…',back:'← Atrás',hand:'Una mano',both:'Las dos manos',order:'Dame mi código',name:'Tu nombre',tapnail:'Toca una uña para cambiarla',letters:'Escribe letras, un número o un emoji',photo:'Usar mi foto',polish:'Esmalte debajo de esta uña',inkc:'Color de impresión',done:'Listo',codeH:'Tu código',codeP:'Muéstraselo a {HOST}. Te enseñan a imprimirlo — tú haces cada paso.',again:'Hacer otro',split:'Dúo — dos personas',custom:'personalizado',lang:'English'}};
function t(k){const d=T[S.lang]||T.en; return String(d[k]??T.en[k]).replace(/\{HOST\}/g,HOST())}

function viewChapters(){
  const q=S.q||'';
  let html='<h1>'+t('h1')+'</h1><p class="muted">'+t('lede')+'</p><div class="row"><input id="q" placeholder="'+t('search')+'" value="'+esc(q)+'" style="flex:1"><button class="btn ghost sm" id="langBtn">'+(function(){const L=['en','es','pt','vi'].filter(l=>LIB[l.toUpperCase()]&&LIB[l.toUpperCase()].length);const nx=L[(L.indexOf(S.lang)+1)%L.length];return {en:'English',es:'Español',pt:'Português',vi:'Tiếng Việt'}[nx]||nx;})()+'</button></div>';
  html+='<div class="row" style="margin-top:8px"><input id="loves" placeholder="'+(S.lang==='es'?'Dime tres cosas que amas…':'Tell me three things you love…')+'" value="'+esc(S.lovesQ||'')+'" style="flex:1"><button class="btn sm" id="sayBtn">✨ '+(S.lang==='es'?'Dilo por mí':'Say it for me')+'</button></div>';

code + five tile codes + polish + ink</b>. Tile codes match the files in the tile library (tiles/&lt;code&gt;.png). The host loads the tiles once into the printer; the recipe tells them which five to tap.</div>'; }
function wireNat(){
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{ const o=S.orders.find(x=>x.code===b.dataset.c); if(!o) return; o.status=b.dataset.st; if(b.dataset.st==='done') o.completed=new Date().toISOString(); await saveOrder(o); render(); });
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;render()});
  if($('lookup')) $('lookup').oninput=e=>{ const v=e.target.value.trim().toUpperCase(); if(v.length===5){ const o=S.orders.find(x=>x.code===v); if(o){ S.filter='all'; render(); setTimeout(()=>{const el=[...document.querySelectorAll('.oc')].find(x=>x.textContent===v); if(el) el.scrollIntoView({behavior:'smooth',block:'center'})},0);} else toast('No order '+v); } };
  if($('csv')) $('csv').onclick=async()=>{ const rows=[['code','created','completed','status','name','lang','set','answer','price','kiosk','hand','slot','tile','text','polish','ink','changed']]; S.orders.forEach(o=>o.hands.forEach((h,hi)=>h.forEach((x,i)=>rows.push([o.code,o.created,o.completed||'',o.status,o.name,o.lang,o.setCode,o.answer,o.price,o.kiosk||'',hi+1,i+1,x.tile,x.photo?'[photo]':x.t,x.polish,x.ink,x.changed?1:0])))); const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'); if(S.dl){ try{ await S.dl.save({filename:'read-my-nails-orders.csv',data:csv}); }catch(e){ toast('Download cancelled'); } } else { const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='read-my-nails-orders.csv'; a.click(); } };
  if($('addB')) $('addB').onclick=async()=>{ const b={id:'b'+Date.now(), name:$('bn').value.trim(), phone:$('bp').value.trim(), date:$('bd').value, time:$('bt').value, head:+$('bh').value||1, pkg:$('bk').value, notes:$('bx').value.trim(), created:new Date().toISOString()}; if(!b.name||!b.date){toast('Name and date');return;} S.bookings.push(b); await saveBooking(b); render(); };
  app.querySelectorAll('[data-delb]').forEach(x=>x.onclick=async()=>{ const id=x.dataset.delb; S.bookings=S.bookings.filter(b=>b.id!==id); await deleteBooking(id); render(); });
  if($('saveS')) { const s=S.settings;
    $('addPol').onclick=()=>{s.polishes.push({n:'New',h:'#F27BA5'});render()}; $('addInk').onclick=()=>{s.inks.push({n:'New',h:'#111111'});render()};
    app.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{s.polishes.splice(+b.dataset.pdel,1);render()}); app.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{s.inks.splice(+b.dataset.idel,1);render()});
    app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const c=b.dataset.ch; const i=s.chaptersOff.indexOf(c); if(i>=0) s.chaptersOff.splice(i,1); else s.chaptersOff.push(c); render(); });
    $('saveS').onclick=async()=>{ s.kiosk=$('sk').value;  app.querySelectorAll('[data-price]').forEach(i=>s.prices[i.dataset.price]=+i.value||0); app.querySelectorAll('[data-ph]').forEach(i=>s.polishes[+i.dataset.ph].h=i.value); app.querySelectorAll('[data-pn]').forEach(i=>s.polishes[+i.dataset.pn].n=i.value); app.querySelectorAll('[data-ih]').forEach(i=>s.inks[+i.dataset.ih].h=i.value); app.querySelectorAll('[data-in]').forEach(i=>s.inks[+i.dataset.in].n=i.value); s.updated=Date.now(); await saveSettings(); toast('Saved'); render(); };
  }
}

// ---------- storage: production (API routes → Supabase) ----------
const LS={get(k,d){try{return JSON.parse(localStorage.getItem('rmn_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('rmn_'+k,JSON.stringify(v))}catch(e){}}};
let PIN=sessionStorage.getItem('rmn_pin')||'';
const H=()=>({'Content-Type':'application/json','x-kiosk-pin':PIN,'x-tenant':TENANT_ID});
async function api(path,opt){ const r=await fetch(path,Object.assign({headers:H()},opt||{})); if(r.status===401){S.authed=false; throw new Error('pin');} const j=await r.json(); if(r.status===400&&j&&j.error){ const e=new Error(j.error); e.user=true; throw e; } return j; }
async function saveOrder(o){ const i=S.orders.findIndex(x=>x.code===o.code); const isNew=i<0; if(i>=0) S.orders[i]=o; else S.orders.push(o);
  try{ if(isNew) await api('/api/orders',{method:'POST',body:JSON.stringify(o)}); else await api('/api/orders',{method:'PATCH',body:JSON.stringify({code:o.code,status:o.status})}); S.live=true; return true; }catch(e){ if(e.user){ S.orders=S.orders.filter(x=>x.code!==o.code); toast(e.message); return false; } S.live=false; toast('Could not reach the server'); return true; } }
async function saveBooking(b){ try{ await api('/api/bookings',{method:'POST',body:JSON.stringify(b)}); }catch(e){ toast('Could not save booking'); } }
async function deleteBooking(id){ try{ await api('/api/bookings',{method:'DELETE',body:JSON.stringify({id})}); }catch(e){} }
async function saveSettings(){ LS.set('settings',S.settings); try{ await api('/api/settings',{method:'PUT',body:JSON.stringify(S.settings)}); }catch(e){ toast('Could not save settings'); } }
function loadLocal(){ const st=LS.get('settings',null); if(st) S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st,{pin:S.settings.pin}); }
function normOrder(r){ return {code:r.code,status:r.status,created:r.created_at,completed:r.completed_at,name:r.name,lang:r.lang,setCode:r.set_code,answer:r.answer,split:r.split,who:r.who,price:Number(r.price),kiosk:r.kiosk,hands:r.hands,paid:r.paid}; }
async function refresh(){ if(S.mode!=='host'||!S.authed) return; try{ const rows=await api('/api/orders?scope='+(S.filter==='active'?'active':S.filter==='today'?'today':'all')); S.orders=rows.map(normOrder); if(S.nview==='book'){ S.bookings=await api('/api/bookings'); } S.live=true; render(); }catch(e){ S.live=false; } }
async function connect(){ try{ const r=await fetch('/api/settings',{headers:H()}); if(r.status===402){ app.innerHTML='<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><h2>This kiosk is not active</h2><p class="muted">The Read My Nails subscription for this location has lapsed. The owner can fix it at readmynails.com/dashboard.</p></div>'; return; } const s=await r.json(); if(s&&!s.error){ mergeChapters(s.chapters); delete s.chapters; S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),s); const b=document.getElementById('brandName'); if(b) b.textContent=S.settings.kiosk||'Read My Nails'; render(); } }catch(e){} setInterval(refresh,4000); }
// PIN is verified by the server: override the local check.
async function tryPin(v){ PIN=v; try{ await api('/api/orders?scope=active'); sessionStorage.setItem('rmn_pin',v); S.authed=true; await refresh(); render(); }catch(e){ toast('Wrong PIN'); } }

// ---------- coach (host assistant) ----------
S.coach=S.coach||[];
function coachHTML(){ const name=HOST(); return '<h2>'+esc(name)+"'s coach</h2><p class=\"muted\">"+(S.lang==='es'?'Pregunta lo que sea entre clientas: un manchón, una mamá que pregunta, qué decir.':'Ask anything between customers: a smudge, a mom with a question, what to say.')+'</p><div class="card" id="coachLog" style="max-height:50vh;overflow:auto">'+(S.coach.length?S.coach.map(m=>'<p class="'+(m.role==='assistant'?'coachA':'coachU')+'">'+esc(m.content)+'</p>').join(''):'<p class="muted">'+(S.lang==='es'?'Ej: "se le corrió la uña 3", "¿puedo hacerle la uña a una niña de 6?", "una clienta ya trae gel"':'Try: "nail 3 smudged", "can I do a 6-year-old?", "she already has gel on"')+'</p>')+'</div><div class="row" style="margin-top:8px"><input id="coachQ" placeholder="'+(S.lang==='es'?'Escribe…':'Type…')+'" style="flex:1"><button class="btn sm" id="coachSend">'+(S.lang==='es'?'Preguntar':'Ask')+'</button></div><div class="chips" style="margin-top:8px">'+['Smudged nail','Gel on skin','She has acrylics','Print off-center','Kid won\'t hold still','Can you just do it for me?','What do I say in Spanish?'].map(q=>'<button class="chip" data-cq="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>'; }
async function askCoach(q){ q=(q||'').trim(); if(!q) return; S.coach.push({role:'user',content:q}); render(); try{ const r=await fetch('/api/ai/host',{method:'POST',headers:H(),body:JSON.stringify({messages:S.coach.slice(-12),lang:S.lang})}); const j=await r.json(); S.coach.push({role:'assistant',content:j.reply||j.error||'…'}); }catch(e){ S.coach.push({role:'assistant',content:'Could not reach the coach.'}); } render(); const el=$('coachLog'); if(el) el.scrollTop=el.scrollHeight; }

// ---------- router ----------
function render(){ if(S.mode==='customer'){ if(S.view==='sets') viewSets(); else if(S.view==='build') viewBuild(); else if(S.view==='code') viewCode(); else viewChapters(); } else { if(!S.authed) viewPin(); else viewNat(); } $('tabC').setAttribute('aria-pressed',S.mode==='customer'); $('tabN').setAttribute('aria-pressed',S.mode==='host'); window.scrollTo({top:0}); }
$('tabC').onclick=()=>{S.mode='customer';render()}; $('tabN').onclick=()=>{S.mode='host';render()}; $('home').onclick=e=>{e.preventDefault();S.mode='customer';S.view='chapters';S.chapter=null;S.q='';render()};
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('/sw.js'); }catch(e){} }
loadLocal(); (function(){const b=document.getElementById('brandName'); if(b&&S.settings.kiosk) b.textContent=S.settings.kiosk;})(); render(); connect();
</script>

</body></html>
